// === MAIN APP ===
function App() {
  const defaultTweaks = Object.assign({}, window.TWEAK_DEFAULTS);
  const [tweaks, setTweaks] = React.useState(defaultTweaks);
  const [dark, setDark] = React.useState(window.matchMedia('(prefers-color-scheme: dark)').matches);
  const [activeSection, setActiveSection] = React.useState('about');
  const [editMode, setEditMode] = React.useState(false);

  // Edit mode protocol
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data && e.data.type === '__activate_edit_mode') setEditMode(true);
      if (e.data && e.data.type === '__deactivate_edit_mode') setEditMode(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  // Persist tweaks
  React.useEffect(() => {
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: tweaks }, '*');
  }, [tweaks]);

  // Scroll spy
  React.useEffect(() => {
    const sections = ['about', 'experience', 'projects', 'education', 'contact'];
    const handler = () => {
      for (const id of [...sections].reverse()) {
        const el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top < 200) {
          setActiveSection(id);
          break;
        }
      }
    };
    window.addEventListener('scroll', handler);
    return () => window.removeEventListener('scroll', handler);
  }, []);

  const onNav = (id) => {
    const el = document.getElementById(id);
    if (el) {
      const y = el.getBoundingClientRect().top + window.scrollY - 70;
      window.scrollTo({ top: y, behavior: 'smooth' });
    }
  };

  const themeKey = tweaks.theme || 'editorial';
  const theme = THEMES[themeKey];
  const colors = dark ? theme.dark : theme.light;
  const fonts = theme.fonts;

  const heroMap = {
    editorial: { split: HeroEditorial, textFirst: HeroEditorial, centered: HeroEditorial },
    tech: { split: HeroTech, textFirst: HeroTech, centered: HeroTech },
    bold: { split: HeroBold, textFirst: HeroBold, centered: HeroBold },
  };

  // Choose hero based on theme + hero tweak
  let HeroComponent;
  if (tweaks.hero === 'split') {
    HeroComponent = themeKey === 'editorial' ? HeroEditorial : themeKey === 'tech' ? HeroTech : HeroBold;
  } else if (tweaks.hero === 'textFirst') {
    HeroComponent = HeroTextFirst;
  } else {
    HeroComponent = HeroCentered;
  }

  return React.createElement(ThemeContext.Provider, {
    value: { colors, fonts, dark, setDark, themeName: themeKey }
  },
    React.createElement('div', {
      style: {
        background: colors.bg, color: colors.text, minHeight: '100vh',
        fontFamily: fonts.body, transition: 'background 0.3s, color 0.3s',
      }
    },
      React.createElement(Nav, { activeSection, onNav }),
      React.createElement(HeroComponent, null),
      React.createElement(SkillsSection, null),
      React.createElement(ExperienceSection, null),
      React.createElement(ProjectsSection, null),
      React.createElement(EducationSection, null),
      React.createElement(ContactSection, null),
      React.createElement(Footer, null),
      editMode && React.createElement(TweaksPanel, { tweaks, setTweaks }),
    )
  );
}
